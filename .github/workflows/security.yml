name: Server security regression
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/security.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/security.yml']
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install server and test dependencies
        run: python -m pip install -r server/requirements.txt pytest
      - name: Compile server
        run: python -m compileall -q server
      - name: Run session and security regressions with real Redis abuse counters
        env:
          SECURITY_TEST_REDIS_URL: redis://localhost:6379/15
        run: python -m pytest server/tests -q
